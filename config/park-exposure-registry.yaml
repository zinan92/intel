  - {id: BTC,        name: 比特币,           market: CRYPTO, kind: crypto}
  - {id: ETH,        name: 以太坊,           market: CRYPTO, kind: crypto}
  - {id: HYPE,       name: Hyperliquid HYPE, market: CRYPTO, kind: crypto}
