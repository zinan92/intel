# ---------------------------------------------------------------------------
# 新闻 exposure 的确定性别名。只负责把新闻送进 AI triage，不决定 High /
# Watch / Noise / Unknown。target 引用下面 sectors 中已有的 target id。
# ---------------------------------------------------------------------------
matching:
  version: 1
  content_chars: 2000
  aliases:
    - {id: ai_development, target: ai-development, terms: [AI, 人工智能, 大模型, 生成式AI, 生成式 AI, 算力, GPU, 数据中心, AI服务器, AI编程, AI模型, AI应用, Agent, 智能体, 模型训练, 模型推理, Token, 词元, Kimi, 商汤]}
    - {id: ai_compute, target: ai-compute, terms: [GPU, HBM, AI芯片, 算力芯片, 半导体, 芯片]}
    - {id: electronic_components, target: electronic-components, terms: [MLCC, 电子元件, 被动元件, 电容]}
    - {id: optical_communication, target: optical-communication, terms: [光通信, 光模块, InP, CPO, NPO, 光纤]}
    - {id: embodied_ai, target: embodied-ai, terms: [具身智能, 人形机器人]}
    - {id: innovative_drugs, target: innovative-drugs, terms: [创新医药, 生物医药, 新药, 药物, 药品, 药业, 临床, 治疗, 医保, 肿瘤, 抗体, 疫苗, GLP-1, ADC, 制药, 药企, 病种]}
    - {id: ai_generation, target: ai-generation, terms: [核电, 核能, 电力供应, AI发电, 数据中心用电]}
    - {id: power_equipment, target: power-equipment, terms: [变压器, UPS, 开关柜, 电缆, 线缆, 电力设备]}
    - {id: commercial_space, target: commercial-space, terms: [商业航天, 火箭, 卫星互联网]}
    - {id: hormuz_strait, target: hormuz-strait, terms: [霍尔木兹, Hormuz]}
    - {id: opec, target: opec, terms: [OPEC]}
    - {id: russia_ukraine, target: russia-ukraine-war, terms: [俄乌, 俄罗斯, 乌克兰]}
    - {id: geopolitical_crisis, target: geopolitical-crisis, terms: [地缘冲突, 地缘危机, 霍尔木兹, 伊朗, 以色列, 红海, 制裁, 关税, 导弹, 空袭, 油轮, 台海, 南海, 马岛]}
