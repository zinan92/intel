# Park Exposure Registry
#
# 唯一权威名单。K 线/行情侧与新闻 exposure 侧都从这里取，不各自维护副本。
# 结构：root -> macro(宏观主线) -> sector(中观赛道) -> target(微观标的)
#
# 修改规则：
#   1. 每个 target 必须有 reason，写明它为什么在表里。无 reason 不入表。
#   2. 未上市公司 listed: false，绝不分配市场代码。
#   3. 允许多归属：一个 target 可出现在多个 sector 下（如 TSM）。
#   4. assets 段是 Park 实际有行情/K 线的对象，与 targets 是两件事，不要混。

version: 6
updated: "2026-09-03"
maintainer: park

# ---------------------------------------------------------------------------
# 有行情 / K 线的资产（16 个）。这是「看什么价格」，不是「新闻在讲什么」。
# ---------------------------------------------------------------------------
